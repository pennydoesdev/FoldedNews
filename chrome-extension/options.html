<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
      label { display: block; font-weight: 600; margin-top: 16px; }
      textarea, input { width: 100%; font: inherit; padding: 6px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 8px 14px; }
      .muted { color: #777; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>FoldedNews QA — Options</h1>
    <label for="domains">Allowed newsroom domains (one per line)</label>
    <textarea id="domains" rows="5" placeholder="foldednews.test&#10;staging.foldednews.com"></textarea>
    <p class="muted">Checks only run on these domains. Subdomains are included.</p>

    <label for="health">Health endpoint (optional)</label>
    <input id="health" type="url" placeholder="https://foldednews.test/wp-json/foldednews/v1/health" />

    <button id="save">Save</button>
    <span id="status" class="muted"></span>
    <script src="options.js"></script>
  </body>
</html>
